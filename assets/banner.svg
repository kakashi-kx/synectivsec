<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SynectivSec</title>
  <desc id="d">A composition theorem for federated agent authority. PC, RS and CBAT imply CI1 to CI5. TLA+ model checked on a bounded instance: 11,185,890 states, 300,447 distinct, 0 violations.</desc>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="6" height="299" rx="3" fill="#58a6ff"/>

  <!-- title block -->
  <text x="56" y="98" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1">SynectivSec</text>
  <text x="58" y="136" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9da7b3">A composition theorem for federated agent authority</text>

  <!-- theorem -->
  <text x="58" y="182" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="22" fill="#58a6ff">PC ∧ RS ∧ CBAT  ⇒  CI1–CI5</text>

  <!-- divider -->
  <line x1="56" y1="208" x2="1144" y2="208" stroke="#30363d"/>

  <!-- stats -->
  <g font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="58" y="234" font-size="12" letter-spacing="1.5" fill="#7d8590">STATES CHECKED</text>
    <text x="58" y="262" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="24" font-weight="600" fill="#f0f6fc">11,185,890</text>

    <text x="318" y="234" font-size="12" letter-spacing="1.5" fill="#7d8590">DISTINCT</text>
    <text x="318" y="262" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="24" font-weight="600" fill="#f0f6fc">300,447</text>

    <text x="518" y="234" font-size="12" letter-spacing="1.5" fill="#7d8590">VIOLATIONS</text>
    <text x="518" y="262" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="24" font-weight="600" fill="#3fb950">0</text>

    <text x="678" y="234" font-size="12" letter-spacing="1.5" fill="#7d8590">SCOPE</text>
    <text x="678" y="262" font-family="'SF Mono','JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="24" font-weight="600" fill="#d29922">bounded instance</text>
  </g>

  <!-- author, right aligned -->
  <g font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="end">
    <text x="1144" y="60" font-size="15" fill="#f0f6fc">Abhijith S</text>
    <text x="1144" y="60" font-size="15" fill="#f0f6fc">kakashi4kx</text>
    <text x="1144" y="82" font-size="13" fill="#7d8590">ORCID 0009-0009-9232-7820</text>
    <text x="1144" y="104" font-size="13" fill="#7d8590">github.com/kakashi-kx/synectivsec</text>
    <text x="1144" y="126" font-size="13" fill="#7d8590">TLA+ · Python harness · paper (16 pp.)</text>
  </g>
</svg>
