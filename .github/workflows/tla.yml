name: TLA+ verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tlc:
    name: TLC model check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download tla2tools.jar
        run: |
          mkdir -p ~/tla
          wget -q https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar -O ~/tla/tla2tools.jar
          ls -la ~/tla/

      - name: Run TLC
        run: |
          cd tla
          java -Xmx2g -XX:+UseParallelGC -jar ~/tla/tla2tools.jar \
              -workers 2 -config Composition.cfg Composition.tla

      - name: Run attack harness
        env:
          TLA_JAR: /home/runner/tla/tla2tools.jar
        run: |
          cd redteam
          chmod +x run_all.sh
          ./run_all.sh
